services:
  stremlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src:/app/src

  qdrant:
      image: qdrant/qdrant:v1.20.0
      ports:
        - "6333:6333"
        - "6334:6334"
      volumes:
        - ./qdrant_storage_v1_20_0:/qdrant/storage
      restart: unless-stopped