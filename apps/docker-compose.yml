services:
  chatbot-ui:
    build:
      context: ..
      dockerfile: apps/chatbot_ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./chatbot_ui/src:/app/apps/chatbot_ui/src

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    restart: unless-stopped
    volumes:
      - ./api/src:/app/apps/api/src
